services:
  db: {image: "postgres:16", environment: {POSTGRES_DB: dubsdigs, POSTGRES_USER: dubsdigs, POSTGRES_PASSWORD: dubsdigs}, volumes: ["pg:/var/lib/postgresql/data"]}
  redis: {image: "redis:7"}
  backend:
    build: ./backend
    command: sh -c "python manage.py migrate && python manage.py seed && daphne -b 0.0.0.0 -p 8000 dubsdigs.asgi:application"
    environment: {POSTGRES_HOST: db, POSTGRES_DB: dubsdigs, POSTGRES_USER: dubsdigs, POSTGRES_PASSWORD: dubsdigs, REDIS_URL: "redis://redis:6379"}
    depends_on: [db, redis]
    ports: ["8000:8000"]
  frontend:
    image: "node:20"
    working_dir: /app
    volumes: ["./frontend:/app"]
    command: sh -c "npm install && npm run dev -- --host"
    environment: {API_TARGET: "http://backend:8000"}
    ports: ["5173:5173"]
    depends_on: [backend]
volumes: {pg: {}}
